<!doctype html>
<html>
  <head>
    <title>Admin Dashboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Admin Dashboard</h1>
      <p>Total Treks: {{ total_treks }}</p>
      <p>Total Users: {{ total_users }}</p>
      <p>Total Staff: {{ total_staff }}</p>
      <p>Total Bookings: {{ total_bookings }}</p>
      <hr />
      <a class="button" href="{{ url_for('routes.add_trek') }}">Add Trek</a>
      <a class="button" href="{{ url_for('routes.view_treks') }}">View Treks</a>
      <a class="button" href="{{ url_for('routes.staff_requests') }}"
        >Staff Requests</a
      >
      <a class="button" href="{{ url_for('routes.view_staff') }}">View Staff</a>
      <a class="button" href="{{ url_for('routes.view_users') }}">View Users</a>
      <a class="button" href="{{ url_for('routes.view_bookings') }}"
        >View Bookings</a
      >
      <p><a href="{{ url_for('auth.logout') }}">Logout</a></p>
    </div>
  </body>
</html>
