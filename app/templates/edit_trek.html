<!doctype html>
<html>
  <head>
    <title>Edit Trek</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>Edit Trek</h2>
      <form method="POST">
        <label>Name</label
        ><input name="trek_name" value="{{ trek.trek_name }}" required /><label
          >Location</label
        ><input name="location" value="{{ trek.location }}" required /><label
          >Difficulty</label
        ><select name="difficulty">
          <option {% if trek.difficulty=="Easy" %}selected{% endif %}>
            Easy
          </option>
          <option {% if trek.difficulty=="Moderate" %}selected{% endif %}>
            Moderate
          </option>
          <option {% if trek.difficulty=="Hard" %}selected{% endif %}>
            Hard
          </option></select
        ><label>Duration</label
        ><input
          type="number"
          name="duration"
          value="{{ trek.duration }}"
          required
        /><label>Slots</label
        ><input
          type="number"
          name="available_slots"
          value="{{ trek.available_slots }}"
          required
        /><label>Start Date</label
        ><input
          type="date"
          name="start_date"
          value="{{ trek.start_date }}"
          required
        /><label>End Date</label
        ><input
          type="date"
          name="end_date"
          value="{{ trek.end_date }}"
          required
        /><label>Status</label
        ><select name="status">
          <option {% if trek.status=="Pending" %}selected{% endif %}>
            Pending
          </option>
          <option {% if trek.status=="Open" %}selected{% endif %}>
            Open
          </option>
          <option {% if trek.status=="Closed" %}selected{% endif %}>
            Closed
          </option>
          <option {% if trek.status=="Completed" %}selected{% endif %}>
            Completed
          </option></select
        ><button>Update</button>
      </form>
    </div>
  </body>
</html>
