<!DOCTYPE html>
<html>

<head>

<title>Edit Trek</title>

</head>

<body>

<h2>Edit Trek</h2>

<form method="POST">

<input
type="text"
name="trek_name"
value="{{ trek.trek_name }}"
required>

<br><br>

<input
type="text"
name="location"
value="{{ trek.location }}"
required>

<br><br>

<select name="difficulty">

<option {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>

<option {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>

<option {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>

</select>

<br><br>

<input
type="number"
name="duration"
value="{{ trek.duration }}"
required>

<br><br>

<input
type="number"
name="available_slots"
value="{{ trek.available_slots }}"
required>

<br><br>

<select name="status">

<option {% if trek.status=="Open" %}selected{% endif %}>Open</option>

<option {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>

<option {% if trek.status=="Completed" %}selected{% endif %}>Completed</option>

</select>

<br><br>

<button type="submit">

Update Trek

</button>

</form>

</body>

</html>
