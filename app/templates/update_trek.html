<!doctype html>
<html>
  <head>
    <title>Update Trek</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>Update Trek</h2>
      <form method="POST">
        <p>{{ trek.trek_name }}</p>
        <label>Available Slots</label
        ><input
          type="number"
          name="available_slots"
          value="{{ trek.available_slots }}"
          required
        /><label>Status</label
        ><select name="status">
          <option {% if trek.status=="Open" %}selected{% endif %}>
            Open
          </option>
          <option {% if trek.status=="Closed" %}selected{% endif %}>
            Closed
          </option>
          <option {% if trek.status=="Started" %}selected{% endif %}>
            Started
          </option>
          <option {% if trek.status=="Completed" %}selected{% endif %}>
            Completed
          </option></select
        ><button>Update</button>
      </form>
      <a href="{{ url_for('routes.staff_dashboard') }}">Back</a>
    </div>
  </body>
</html>
