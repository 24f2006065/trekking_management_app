<!doctype html>
<html>
  <head>
    <title>Add Trek</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>Add Trek</h2>
      <form method="POST">
        <label>Trek Name</label><input name="trek_name" required /><label
          >Location</label
        ><input name="location" required /><label>Difficulty</label
        ><select name="difficulty">
          <option>Easy</option>
          <option>Moderate</option>
          <option>Hard</option></select
        ><label>Duration</label
        ><input type="number" name="duration" required /><label
          >Available Slots</label
        ><input type="number" name="available_slots" required /><label
          >Start Date</label
        ><input type="date" name="start_date" required /><label>End Date</label
        ><input type="date" name="end_date" required /><label>Status</label
        ><select name="status">
          <option>Pending</option>
          <option>Open</option>
          <option>Closed</option></select
        ><button>Add Trek</button>
      </form>
      <a href="{{ url_for('routes.admin_dashboard') }}">Back</a>
    </div>
  </body>
</html>
