<!doctype html>
<html>
  <head>
    <title>Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>
      {% for message in get_flashed_messages() %}
      <p class="flash">{{ message }}</p>
      {% endfor %}
      <form method="POST">
        <label>Email</label><input type="email" name="email" required /><label
          >Password</label
        ><input type="password" name="password" required /><button>
          Login
        </button>
      </form>
      <a href="{{ url_for('auth.register_choice') }}">Create account</a>
    </div>
  </body>
</html>
