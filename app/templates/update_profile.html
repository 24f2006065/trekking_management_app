<!doctype html>
<html>
  <head>
    <title>Update Profile</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>Update Profile</h2>
      <form method="POST">
        <label>Name</label
        ><input name="name" value="{{ current_user.name }}" required /><label
          >Email</label
        ><input
          type="email"
          name="email"
          value="{{ current_user.email }}"
          required
        />{% if current_user.role == 'staff' %}<label>Contact</label
        ><input
          name="contact"
          value="{{ current_user.staff_profile.contact }}"
          required
        />{% endif %}<button>Update</button>
      </form>
      <a href="{{ url_for('routes.dashboard') }}">Back</a>
    </div>
  </body>
</html>
