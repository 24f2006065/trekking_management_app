<!doctype html>
<html>
  <head>
    <title>Bookings</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>All Bookings</h2>
      <table>
        <tr>
          <th>ID</th>
          <th>User</th>
          <th>Trek</th>
          <th>Date</th>
          <th>Booking Status</th>
          <th>Trek Status</th>
        </tr>
        {% for booking in bookings %}
        <tr>
          <td>{{ booking.id }}</td>
          <td>{{ booking.user.name }}</td>
          <td>{{ booking.trek.trek_name }}</td>
          <td>{{ booking.booking_date }}</td>
          <td>{{ booking.status }}</td>
          <td>{{ booking.trek.status }}</td>
        </tr>
        {% endfor %}
      </table>
      <p><a href="{{ url_for('routes.admin_dashboard') }}">Dashboard</a></p>
    </div>
  </body>
</html>
