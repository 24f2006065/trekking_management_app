<table border="1">

<tr>

<th>Name</th>

<th>Email</th>

<th>Status</th>

<th>Action</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.user.name }}</td>

<td>{{ booking.user.email }}</td>

<td>{{ booking.status }}</td>

<td>

{% if booking.status=="Booked" %}

<a href="{{ url_for('routes.complete_booking',
booking_id=booking.id) }}">

Complete

</a>

{% else %}

--

{% endif %}

</td>

</tr>

{% endfor %}

</table>
