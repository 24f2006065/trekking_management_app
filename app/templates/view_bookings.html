<!DOCTYPE html>
<html>

<head>
    <title>All Bookings</title>
</head>

<body>

<h2>Booking History</h2>

<table border="1">

<tr>

<th>ID</th>
<th>User</th>
<th>Trek</th>
<th>Booking Date</th>
<th>Booking Status</th>
<th>Trek Status</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.id }}</td>

<td>{{ booking.user.name }}</td>

<td>{{ booking.trek.trek_name }}</td>

<td>{{ booking.booking_date }}</td>

<td>{{ booking.status }}</td>

<td>{{ booking.trek.status }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="{{ url_for('routes.admin_dashboard') }}">
Dashboard
</a>

</body>

</html>
