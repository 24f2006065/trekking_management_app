<!doctype html>
<html>
  <head>
    <title>Staff</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>All Trek Staff</h2>
      <form method="GET">
        <input name="q" value="{{ query }}" placeholder="Search name" /><button>
          Search
        </button>
      </form>
      <table>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Contact</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
        {% for profile in staff %}
        <tr>
          <td>{{ profile.user.name }}</td>
          <td>{{ profile.user.email }}</td>
          <td>{{ profile.contact }}</td>
          <td>{{ profile.status }}</td>
          <td>
            <a href="{{ url_for('routes.blacklist_staff', id=profile.id) }}"
              >Blacklist</a
            >
          </td>
        </tr>
        {% endfor %}
      </table>
      <p><a href="{{ url_for('routes.admin_dashboard') }}">Dashboard</a></p>
    </div>
  </body>
</html>
