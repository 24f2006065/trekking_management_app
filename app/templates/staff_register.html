<!doctype html>
<html>
  <head>
    <title>Staff Register</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>Trek Staff Registration</h2>
      {% for message in get_flashed_messages() %}
      <p class="flash">{{ message }}</p>
      {% endfor %}
      <form method="POST">
        <label>Name</label><input name="name" required /><label>Email</label
        ><input type="email" name="email" required /><label>Contact</label
        ><input name="contact" required /><label>Password</label
        ><input type="password" name="password" required /><button>
          Register
        </button>
      </form>
      <p>Approval by admin is required.</p>
      <a href="{{ url_for('auth.login') }}">Login</a>
    </div>
  </body>
</html>
