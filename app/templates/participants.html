<!DOCTYPE html>
<html>

<head>

<title>Participants</title>

</head>

<body>

<h2>{{ trek.trek_name }}</h2>

<table border="1">

<tr>

<th>Name</th>

<th>Email</th>

<th>Status</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.user.name }}</td>

<td>{{ booking.user.email }}</td>

<td>{{ booking.status }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
