<!doctype html>
<html>
  <head>
    <title>Staff Requests</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>Pending Staff Requests</h2>
      <table>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Contact</th>
          <th>Action</th>
        </tr>
        {% for profile in staff %}
        <tr>
          <td>{{ profile.user.name }}</td>
          <td>{{ profile.user.email }}</td>
          <td>{{ profile.contact }}</td>
          <td>
            <a href="{{ url_for('routes.approve_staff', id=profile.id) }}"
              >Approve</a
            >
          </td>
        </tr>
        {% endfor %}
      </table>
      <p><a href="{{ url_for('routes.admin_dashboard') }}">Dashboard</a></p>
    </div>
  </body>
</html>
